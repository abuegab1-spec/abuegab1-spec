<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="title desc">
<title id="title">From intent to a system that can be trusted</title>
<desc id="desc">A conceptual working model: intent and context flow through agent orchestration into tools and services, supported by retrieval and persistent memory. Verification, logs and recovery complete the loop.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DDF36B" opacity=".07"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#DDF36B" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="392" rx="18" fill="#0A2027"/><rect width="1200" height="392" rx="18" fill="url(#dots)"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="42" y="49" fill="#9EB8B5" font-size="18" letter-spacing="3">A WORKING MODEL</text>
<text x="42" y="90" fill="#F2F4E9" font-size="30" font-weight="700">Understand. Connect. Verify. Improve.</text>
<g fill="#102E34" stroke="#36514F"><rect x="42" y="132" width="262" height="116" rx="12"/><rect x="466" y="132" width="270" height="116" rx="12"/><rect x="898" y="132" width="260" height="116" rx="12"/></g>
<rect x="466" y="132" width="270" height="116" rx="12" fill="none" stroke="#DDF36B" stroke-width="1.5"/>
<g fill="#DDF36B" font-size="16" letter-spacing="2"><text x="62" y="161">01 / UNDERSTAND</text><text x="488" y="161">02 / ORCHESTRATE</text><text x="920" y="161">03 / EXECUTE</text></g>
<g fill="#F2F4E9" font-size="27" font-weight="700"><text x="62" y="198">Intent + context</text><text x="488" y="198">Agents + skills</text><text x="920" y="198">Tools + services</text></g>
<g fill="#AAC1BD" font-size="18"><text x="62" y="227">Scope · evidence · constraints</text><text x="488" y="227">Codex · OpenClaw</text><text x="920" y="227">APIs · automation · Linux</text></g>
<path d="M314 190H448M746 190H880" stroke="#DDF36B" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M1028 259V341H173V259" stroke="#77968E" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>
